name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, foundation/site-v1]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Static checks
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Verify output
        run: test -f dist/index.html && test -f dist/robots.txt && test -f dist/sitemap.xml
